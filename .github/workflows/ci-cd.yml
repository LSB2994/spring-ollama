name: LLAMA & DEPLOY

on:
  push:
    branches:
      - develop

env:
  APP_NAME: "spring-ollama"          # Your JAR name (without version)
  DEPLOY_DIR: "/home/lsb/spring-ollama" # Where to deploy on server

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 21

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar
          ls -la build/libs/  # Verify JAR file

      - name: Deploy new JAR
        run: |
          mkdir -p ${{ env.DEPLOY_DIR }}
          cp build/libs/*.jar ${{ env.DEPLOY_DIR }}
          
      - name: Start Application
        run: |
          # Stop any existing instance
          pkill -f "java -jar ${{ env.DEPLOY_DIR }}/*.jar" || true
          sleep 2
          
          # Start new instance with debug info
          cd ${{ env.DEPLOY_DIR }}
          nohup java -jar /*.jar > app.log 2>&1 &
          echo $! > app.pid  # Save PID
          sleep 10  # Warm-up time
      - name: Health Check
        run: |
          sleep 5  # Allow time for startup
          if curl -f http://localhost:8080/actuator/health; then
            echo "Application is running successfully."
          else
            echo "Application failed to start!" >&2
            exit 1  # Fails the deployment if the app is not running
          fi

      - name: View Logs
        run: |
          tail -n 50 ${{ env.DEPLOY_DIR }}/app.log

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Rolling back to previous version..."
          mv ${{ env.DEPLOY_DIR }}/backup.jar ${{ env.DEPLOY_DIR }}/app.jar
          nohup java -jar ${{ env.DEPLOY_DIR }}/app.jar > app.log 2>&1 &

