name: LLAMA CI/CD Pipeline

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

env:
  JAVA_VERSION: '21'
  APP_NAME: "spring-ollama"          # Your JAR name (without version)
  DEPLOY_DIR: "/home/lsb/spring-ollama" # Where to deploy on server
  SERVER_HOST: "172.27.184.67"
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}  # Fixed typo from TELEGRAM_TO

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send deployment start notification
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export TZ="Asia/Phnom_Penh"
          MESSAGE="🚀 *LLAMA DEPLOYMENT STARTED*"$'\n\n'
          MESSAGE+="*Branch:* \`${BRANCH}\`"$'\n'
          MESSAGE+="*Commit:* \`${COMMIT_MSG}\`"$'\n'
          MESSAGE+="*Author:* ${COMMIT_AUTHOR}"$'\n'
          MESSAGE+="*Build:* [View Details](${BUILD_URL})"$'\n'
          MESSAGE+="*Started at:* $(date '+%Y-%m-%d %H:%M:%S')"$'\n\n'
          MESSAGE+="_Deployment in progress..._"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}" \
               -d "text=${MESSAGE}" \
               -d "parse_mode=Markdown" \
               -d "disable_web_page_preview=true" || echo "::warning::Failed to send start notification"

      - name: Set up environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-${{ env.JAVA_VERSION }}-openjdk-amd64" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Determine environment
        id: env
        run: |
          echo "DEPLOY_ENV=development" >> $GITHUB_ENV

      - name: Build application
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test
          ls -la build/libs/  # Verify .jar file creation

      - name: Find JAR file
        id: find-jar
        run: |
          JAR_FILE=$(find $GITHUB_WORKSPACE/build/libs -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No JAR file found in build/libs directory"
            exit 1
          fi
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR file: $JAR_FILE"
          VERSION=$(echo $JAR_FILE | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create backup directory
        run: |
          mkdir -p $DEPLOY_DIR
          echo "Created directory at $DEPLOY_DIR"

      - name: Backup existing deployment
        id: backup
        run: |
          if [ -f "$DEPLOY_DIR/$APP_NAME.jar" ]; then
            BACKUP_FILE="$DEPLOY_DIR/${APP_NAME}_backup_$TIMESTAMP.jar"
            sudo cp "$DEPLOY_DIR/$APP_NAME.jar" "$BACKUP_FILE"
            echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
            echo "has_backup=true" >> $GITHUB_OUTPUT
            echo "Backed up current JAR to $BACKUP_FILE"
          else
            echo "No existing JAR file to backup"
            echo "has_backup=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Server
        run: |
          mkdir -p $DEPLOY_DIR
          pkill -f "java -jar $DEPLOY_DIR/$APP_NAME.jar" || true
          sleep 2
          sudo cp "${{ steps.find-jar.outputs.jar_file }}" "$DEPLOY_DIR/$APP_NAME.jar"
          cd $DEPLOY_DIR
          nohup java -jar "$DEPLOY_DIR/$APP_NAME.jar" > app.log 2>&1 &
          echo $! > app.pid
          sleep 10

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for deployment to initialize..."
          MAX_RETRIES=10
          RETRY_INTERVAL=5
          JAR_PATH="$DEPLOY_DIR/$APP_NAME.jar"
          for (( i=1; i<=MAX_RETRIES; i++ )); do
            if [ -f "$JAR_PATH" ] && pgrep -f "java -jar $JAR_PATH" > /dev/null; then
              echo "✓ JAR file found and running at $JAR_PATH"
              break
            else
              echo "Waiting for JAR to start... (Attempt $i/$MAX_RETRIES)"
              sleep $RETRY_INTERVAL
            fi
          done
          if [ "$i" -gt "$MAX_RETRIES" ]; then
            echo "::warning::JAR file was not found or did not start within expected time"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Waiting for application to initialize..."
          sleep 10
          HEALTH_URL="http://$SERVER_HOST:8080/$APP_NAME/actuator/health"
          echo "Checking health endpoint at $HEALTH_URL"
          for (( i=1; i<=6; i++ )); do
            HEALTH_RESPONSE=$(curl -s -w "%{http_code}" "$HEALTH_URL" -o health_response.txt || echo "000")
            HTTP_STATUS=${HEALTH_RESPONSE: -3}
            if [ "$HTTP_STATUS" -eq 200 ]; then
              APP_STATUS=$(jq -r '.status // "DOWN"' health_response.txt)
              if [ "$APP_STATUS" == "UP" ]; then
                echo "✅ Application health check successful - Status: UP"
                echo "success=true" >> $GITHUB_OUTPUT
                rm -f health_response.txt
                exit 0
              else
                echo "⚠️ Application responded but status is not UP: $APP_STATUS"
              fi
            else
              echo "Health check returned HTTP $HTTP_STATUS (Attempt $i/6), retrying in 10 seconds..."
            fi
            sleep 10
          done
          if [ -f health_response.txt ]; then
            echo "Last health check response:"
            cat health_response.txt
            rm -f health_response.txt
          fi
          echo "::warning::Health check failed after multiple attempts"
          echo "success=false" >> $GITHUB_OUTPUT

      - name: Send success notification
        if: steps.verify.outputs.success == 'true'
        run: |
          export TZ="Asia/Phnom_Penh"
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION="${{ steps.find-jar.outputs.version }}"
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          APP_URL="http://${SERVER_HOST}:8080/${APP_NAME}/swagger-ui/index.html#"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE="✅ *LLAMA DEPLOYMENT SUCCESSFUL*"$'\n\n'
          MESSAGE+="*Branch:* \`${BRANCH}\`"$'\n'
          MESSAGE+="*Version:* \`${VERSION}\`"$'\n'
          MESSAGE+="*Environment:* \`${{ env.DEPLOY_ENV }}\`"$'\n'
          MESSAGE+="*Deployed at:* ${DEPLOY_TIME}"$'\n'
          MESSAGE+="*Application URL:* [Open App](${APP_URL})"$'\n'
          MESSAGE+="*Build Details:* [View Log](${BUILD_URL})"$'\n\n'
          MESSAGE+="✨ _Deployment completed successfully!_"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" || echo "::warning::Failed to send success notification"

      - name: Rollback on failure
        if: failure() || steps.verify.outputs.success == 'false'
        run: |
          echo "Deployment failed. Attempting rollback..."
          export TZ="Asia/Phnom_Penh"
          BACKUP_FILE="${{ steps.backup.outputs.backup_file }}"
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ -n "$BACKUP_FILE" ] && [ -f "$BACKUP_FILE" ]; then
            pkill -f "java -jar $DEPLOY_DIR/$APP_NAME.jar" || true
            sleep 2
            sudo rm -f "$DEPLOY_DIR/$APP_NAME.jar"
            sudo cp "$BACKUP_FILE" "$DEPLOY_DIR/$APP_NAME.jar"
            cd $DEPLOY_DIR
            nohup java -jar "$DEPLOY_DIR/$APP_NAME.jar" > app.log 2>&1 &
            echo $! > app.pid
            echo "Rolled back to previous version"
            ROLLBACK_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            ROLLBACK_MSG="🔄 *AUTOMATIC ROLLBACK PERFORMED*"$'\n\n'
            ROLLBACK_MSG+="*Branch:* \`${BRANCH}\`"$'\n'
            ROLLBACK_MSG+="*Rollback time:* ${ROLLBACK_TIME}"$'\n'
            ROLLBACK_MSG+="*Info:* Deployment failed, rolled back to previous version"$'\n'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                 -d "chat_id=${TELEGRAM_CHAT_ID}" \
                 -d "text=${ROLLBACK_MSG}" \
                 -d "parse_mode=Markdown" || echo "::warning::Rollback notification failed"
          else
            echo "No backup file available for rollback"
            FAILURE_MSG="❌ *DEPLOYMENT FAILED - NO ROLLBACK POSSIBLE*"$'\n\n'
            FAILURE_MSG+="*Branch:* \`${BRANCH}\`"$'\n'
            FAILURE_MSG+="*Time:* $(date '+%Y-%m-%d %H:%M:%S')"$'\n'
            FAILURE_MSG+="*Info:* No previous backup found"$'\n'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                 -d "chat_id=${TELEGRAM_CHAT_ID}" \
                 -d "text=${FAILURE_MSG}" \
                 -d "parse_mode=Markdown" || echo "::warning::Failure notification failed"
          fi

  cleanup:
    runs-on: self-hosted
    needs: build-and-deploy
    if: always()
    env:
      MAX_BACKUPS: 5  # Define max backups to keep
    steps:
      - name: Cleanup old backups
        run: |
          echo "Cleaning up old backups..."
          BACKUP_COUNT=$(ls -1 $DEPLOY_DIR/${APP_NAME}_backup_*.jar 2>/dev/null | wc -l)
          if [ "$BACKUP_COUNT" -gt "$MAX_BACKUPS" ]; then
            REMOVE_COUNT=$((BACKUP_COUNT - MAX_BACKUPS))
            ls -1t $DEPLOY_DIR/${APP_NAME}_backup_*.jar | tail -n $REMOVE_COUNT | xargs rm -f
            echo "Removed $REMOVE_COUNT old backup(s), keeping the $MAX_BACKUPS most recent"
          else
            echo "Found $BACKUP_COUNT backup(s), no cleanup needed (keeping max $MAX_BACKUPS)"
          fi

      - name: Clean build artifacts
        run: |
          find $GITHUB_WORKSPACE -name "*.jar" -delete || true
          ./gradlew clean || true
          echo "Cleaned up build artifacts"