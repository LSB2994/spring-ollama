name: LLAMA CI/CD Pipeline

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

env:
  JAVA_VERSION: '21'
  APP_NAME: "spring-ollama"          # Your JAR name (without version)
  DEPLOY_DIR: "/home/lsb/spring-ollama" # Where to deploy on server
  SERVER_HOST: "172.27.184.67"
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO }}

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send deployment start notification
        run: |
          # Get branch, commit and author info
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          # Set your local timezone (change Asia/Phnom_Penh to your actual timezone)
          export TZ="Asia/Phnom_Penh"
          
          # Prepare the message with proper formatting
          MESSAGE="🚀 *LLAMA DEPLOYMENT STARTED*%0A%0A"
          MESSAGE+="*Branch:* \`${BRANCH}\`%0A"
          MESSAGE+="*Commit:* \`${COMMIT_MSG}\`%0A"
          MESSAGE+="*Author:* ${COMMIT_AUTHOR}%0A"
          MESSAGE+="*Build:* [View Details](${BUILD_URL})%0A"
          MESSAGE+="*Started at:* $(date '+%Y-%m-%d %H:%M:%S')%0A%0A"
          MESSAGE+="_Deployment in progress..._"
          
          # Send message to Telegram group
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}" \
               -d "text=${MESSAGE}" \
               -d "parse_mode=Markdown" \
               -d "disable_web_page_preview=true"

      - name: Set up environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-${{ env.JAVA_VERSION }}-openjdk-amd64" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Determine environment
        id: env
        run: |
          echo "DEPLOY_ENV=development" >> $GITHUB_ENV

      - name: Build application
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test
          ls -la build/libs/  # Verify .jar file creation

      - name: Find JAR file
        id: find-jar
        run: |
          JAR_FILE=$(find $GITHUB_WORKSPACE/build/libs -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No JAR file found in build/libs directory"
            exit 1
          fi
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR file: $JAR_FILE"
          # Save the build version for later
          VERSION=$(echo $JAR_FILE | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create backup directory
        run: |
          mkdir -p $DEPLOY_DIR
          echo "Created backup directory at $DEPLOY_DIR"

      - name: Backup existing deployment
        run: |
          if [ -f "$DEPLOY_DIR/$APP_NAME.jar" ]; then
            # Create backup with timestamp
            BACKUP_FILE="$DEPLOY_DIR/${APP_NAME}_backup_$TIMESTAMP.jar"
            sudo cp "$DEPLOY_DIR/$APP_NAME.jar" "$BACKUP_FILE"
          
            # Keep track of the backup file
            echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
            echo "has_backup=true" >> $GITHUB_OUTPUT
            echo "Backed up current JAR to $BACKUP_FILE"
          else
            echo "No existing JAR file to backup"
            echo "has_backup=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Server
        run: |
          # Create deployment directory
          mkdir -p $DEPLOY_DIR
          
          # Stop any running instance of the application
          pkill -f "java -jar $DEPLOY_DIR/*.jar" || true
          sleep 2
          
          # Deploy the new .jar file
          cp ${{ steps.find-jar.outputs.jar_file }} $DEPLOY_DIR/
          cd $DEPLOY_DIR
          
          # Start the application
          nohup java -jar $DEPLOY_DIR/*.jar > app.log 2>&1 &
          echo $! > app.pid  # Save PID
          sleep 10  # Warm-up time

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for application to initialize..."
          MAX_RETRIES=6
          RETRY_INTERVAL=10

          # Check the health endpoint
          HEALTH_URL="http://${SERVER_HOST}:8080/actuator/health"
          echo "Checking health endpoint at $HEALTH_URL"

          for (( i=1; i<=MAX_RETRIES; i++ )); do
            HEALTH_RESPONSE=$(curl -s -w "%{http_code}" "$HEALTH_URL" || echo "000")
            HTTP_STATUS=${HEALTH_RESPONSE: -3}
            HEALTH_BODY=${HEALTH_RESPONSE%???}
            HEALTH_STATUS=$(echo "$HEALTH_BODY" | jq -r '.status // "DOWN"')

            if [ "$HTTP_STATUS" -eq 200 ] && [ "$HEALTH_STATUS" == "UP" ]; then
              echo "✅ Application health check successful - Status: UP"
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Health check failed (Attempt $i/$MAX_RETRIES): HTTP $HTTP_STATUS, Status: $HEALTH_STATUS, retrying in $RETRY_INTERVAL seconds..."
              sleep $RETRY_INTERVAL
            fi
          done

          echo "::warning::Health check failed after $MAX_RETRIES attempts"
          echo "success=false" >> $GITHUB_OUTPUT

      - name: Send success notification
        if: steps.verify.outputs.success == 'true'
        run: |
          export TZ="Asia/Phnom_Penh"
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION="${{ steps.find-jar.outputs.version }}"
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          APP_URL="http://${SERVER_HOST}:8080/${APP_NAME}/swagger-ui/index.html#"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE="✅ *LLAMA DEPLOYMENT SUCCESSFUL*"$'\n\n'
          MESSAGE+="*Branch:* \`${BRANCH}\`"$'\n'
          MESSAGE+="*Version:* \`${VERSION}\`"$'\n'
          MESSAGE+="*Environment:* \`${BRANCH}\`"$'\n'
          MESSAGE+="*Deployed at:* ${DEPLOY_TIME}"$'\n'
          MESSAGE+="*Application URL:* [Open App](${APP_URL})"$'\n'
          MESSAGE+="*Build Details:* [View Log](${BUILD_URL})"$'\n\n'
          MESSAGE+="✨ _Deployment completed successfully!_"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" || {
            echo "::error::Failed to send Telegram notification"
            exit 1
          }

      - name: Rollback on failure
        if: failure() || steps.verify.outputs.success == 'false'
        run: |
          echo "Deployment failed. Attempting rollback..."
          export TZ="Asia/Phnom_Penh"
          BACKUP_FILE="${{ steps.backup.outputs.backup_file }}"
          BRANCH=${GITHUB_REF#refs/heads/}

          if [ -n "$BACKUP_FILE" ] && [ -f "$BACKUP_FILE" ]; then
            rm -f "$DEPLOY_DIR/$APP_NAME.jar" || {
              echo "::error::Failed to remove current JAR file"
              exit 1
            }
            cp "$BACKUP_FILE" "$DEPLOY_DIR/$APP_NAME.jar" || {
              echo "::error::Failed to copy backup JAR file"
              exit 1
            }
            systemctl restart myapp.service || {
              echo "Systemctl restart failed, falling back to nohup..."
              pkill -f "java -jar $DEPLOY_DIR/$APP_NAME.jar" || true
              nohup java -jar "$DEPLOY_DIR/$APP_NAME.jar" > app.log 2>&1 &
              sleep 5  # Give it a moment to start
            }

            echo "Rolled back to previous version"
            ROLLBACK_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            ROLLBACK_MSG="🔄 *AUTOMATIC ROLLBACK PERFORMED*"$'\n\n'
            ROLLBACK_MSG+="*Branch:* \`${BRANCH}\`"$'\n'
            ROLLBACK_MSG+="*Rollback time:* ${ROLLBACK_TIME}"$'\n'
            ROLLBACK_MSG+="*Info:* Deployment failed, rolled back to previous version"$'\n'

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${ROLLBACK_MSG}" \
                -d "parse_mode=Markdown" || {
              echo "::warning::Rollback succeeded but Telegram notification failed"
            }
          else
            echo "::error::Backup file not found or not defined: $BACKUP_FILE"
            exit 1
          fi

      - name: Failure without rollback notification
        if: (failure() || steps.verify.outputs.success == 'false') && steps.backup.outputs.has_backup != 'true'
        run: |
          echo "Deployment failed, no backup found. Manual intervention required."
          FAILURE_MSG="❌ *LLAMA DEPLOYMENT FAILED*%0A%0A"
          FAILURE_MSG+="*Branch:* \`${BRANCH}\`%0A"
          FAILURE_MSG+="*Failure time:* $(date '+%Y-%m-%d %H:%M:%S')%0A"
          FAILURE_MSG+="*Info:* Deployment failed, no backup available for rollback%0A"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}" \
               -d "text=${FAILURE_MSG}" \
               -d "parse_mode=Markdown"

      - name: Cleanup orphan processes
        run: |
          # Find all orphan Java processes related to the application and terminate them
          echo "Searching for orphan Java processes..."

          # List orphan java processes (excluding the current one)
          ORPHAN_PIDS=$(ps aux | grep 'java -jar $DEPLOY_DIR/*.jar' | grep -v $$ | awk '{print $2}')

          # If orphan PIDs are found, terminate them
          if [ -n "$ORPHAN_PIDS" ]; then
            echo "Terminating orphan processes: $ORPHAN_PIDS"
            for pid in $ORPHAN_PIDS; do
              kill -9 $pid || echo "Failed to terminate process $pid"
            done
          else
            echo "No orphan processes found"
          fi

          # Clean up any temporary files or logs you don't need
          echo "Cleaning up temporary log files..."
          rm -f $DEPLOY_DIR/app.log
