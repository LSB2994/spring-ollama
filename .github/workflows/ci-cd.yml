name: LLAMA & DEPLOY

on:
  push:
    branches:
      - develop

env:
  APP_NAME: "spring-ollama"          # Your JAR name (without version)
  DEPLOY_DIR: "/home/lsb/spring-ollama" # Where to deploy on server

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 21

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar
          ls -la build/libs/  # Verify JAR file

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 172.27.184.67 >> ~/.ssh/known_hosts  # Add remote host to known hosts to prevent SSH prompt

      - name: Copy JAR to server
        run: |
          scp build/libs/*.jar lsb@172.27.184.67:/home/lsb/spring-ollama

      - name: Start Application on Server
        run: |
          ssh lsb@172.27.184.67 << 'EOF'
            # Stop any existing instance of the application
            pkill -f "java -jar /home/lsb/spring-ollama/*.jar" || true
            sleep 2
            
            # Start the new instance of the application
            nohup java -jar /home/lsb/spring-ollama/*.jar > /home/lsb/spring-ollama/app.log 2>&1 &
            echo $! > /home/lsb/spring-ollama/app.pid  # Save PID
            sleep 10  # Warm-up time
          EOF
